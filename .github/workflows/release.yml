name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci
          cd mobile-app && npm ci

      - name: Verify connection and account migration before packaging
        run: |
          npm run check:runtime
          npm --prefix mobile-app run typecheck
          node --test tests/connection-reliability.test.mjs tests/account-migration.test.mjs tests/native-networking.test.mjs tests/sync-connection.test.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd mobile-app/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release Asset to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
