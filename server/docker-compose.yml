services:
  rutin-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rutin-sync-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/rutin.sqlite
      # İsteğe bağlı token koruması için aşağıdaki satırı açın:
      # - API_TOKEN=gizli_anahtariniz_123
    volumes:
      - ./data:/app/data
