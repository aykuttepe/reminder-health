services:
  rutin-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reminder-sync-server
    restart: unless-stopped
    ports:
      - "3050:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/rutin.sqlite
      - WEB_ROOT=/app/web
    volumes:
      - ./data:/app/data
      - ./web:/app/web

